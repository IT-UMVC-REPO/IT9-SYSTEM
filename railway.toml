[build]
buildCommand = "composer install --no-dev --optimize-autoloader && npm install && npm run build && php artisan config:cache && php artisan route:cache && php artisan view:cache"

[deploy]
preDeployCommand = "php artisan storage:link --force && php artisan migrate --force"
startCommand = "php artisan queue:work --tries=3 --sleep=1 --timeout=90 & php artisan serve --host=0.0.0.0 --port=${PORT}"
healthcheckPath = "/up"
healthcheckTimeout = 300
