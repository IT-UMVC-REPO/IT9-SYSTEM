[build]
builder = "DOCKERFILE"

[deploy]
preDeployCommand = "php artisan storage:link --force && php artisan migrate --force"
startCommand = "sh -lc 'php artisan config:cache && php artisan route:cache && php artisan view:cache && exec frankenphp run --config /app/Caddyfile'"
healthcheckPath = "/up"
healthcheckTimeout = 300
