[build]
buildCommand = "composer config http-basic.composer.fluxui.dev $FLUX_USERNAME $FLUX_LICENSE_KEY && composer install --no-dev --optimize-autoloader && npm ci && npm run build"

[deploy]
startCommand = "php artisan migrate --force && php artisan config:cache && php artisan route:cache && php artisan view:cache && php artisan serve --host=0.0.0.0 --port=8000"
healthcheckPath = "/"

